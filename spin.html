<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Art</title>

<style>

<body>
<div id="container">

  <div style="
    position:absolute;
    top:50%;
    left:50%;
    width:auto;
    height:auto;
    transform-style:preserve-3d;
    transform:translate(calc(-50% + 0px), calc(-50% + 0px)) scale(1);
    transform-origin:center center;
  ">
<div class="loadity-field">
  <div class="luhvvstep-loader loader-1"></div>
  <div class="luhvvstep-loader loader-2"></div>
  <div class="luhvvstep-loader loader-3"></div>
  <div class="luhvvstep-loader loader-4"></div>
  <div class="luhvvstep-loader loader-5"></div>
</div>

<style>
  body {
    margin: 0;
    background: #05050a;
    overflow: hidden;
  }

  .loadity-field {
    width: 100vw;
    height: 100vh;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
  }

  .luhvvstep-loader {
    width: 54px;
    height: 54px;
    border-radius: 50%;
    position: relative;

    filter: blur(.2px);

    animation:
      luhvvSpin linear infinite,
      luhvvHue ease-in-out infinite;
  }

  .luhvvstep-loader::after {
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: inherit;
    filter: blur(18px);
    opacity: .6;
    z-index: -1;
  }

  .loader-1 {
    background:
      conic-gradient(
        from 0deg,
        transparent 0deg,
        #121225 60deg,
        #5d2bff 135deg,
        #00d4ff 210deg,
        #ff4fd8 285deg,
        transparent 360deg
      );

    animation-duration: 1.2s, 4s;
  }

  .loader-2 {
    width: 68px;
    height: 68px;

    background:
      conic-gradient(
        from 90deg,
        transparent 0deg,
        #0f1020 60deg,
        #00ffd5 150deg,
        #0091ff 240deg,
        #8b5dff 300deg,
        transparent 360deg
      );

    animation-duration: 2.1s, 7s;
  }

  .loader-3 {
    width: 46px;
    height: 46px;

    background:
      conic-gradient(
        from 180deg,
        transparent 0deg,
        #1a1020 60deg,
        #ff2fa8 140deg,
        #ff7b7b 220deg,
        #8d4dff 310deg,
        transparent 360deg
      );

    animation-duration: .9s, 5s;
  }

  .loader-4 {
    width: 80px;
    height: 80px;

    background:
      conic-gradient(
        from 270deg,
        transparent 0deg,
        #0a0f18 60deg,
        #00d4ff 130deg,
        #00ff88 220deg,
        #5d2bff 300deg,
        transparent 360deg
      );

    animation-duration: 3.4s, 8s;
  }

  .loader-5 {
    width: 58px;
    height: 58px;

    background:
      conic-gradient(
        from 45deg,
        transparent 0deg,
        #161225 60deg,
        #ff4fd8 140deg,
        #00d4ff 230deg,
        #5d2bff 300deg,
        transparent 360deg
      );

    animation-duration: 1.6s, 6s;
  }

  @keyframes luhvvSpin {
    to {
      transform: rotate(360deg);
    }
  }

  @keyframes luhvvHue {
    0%, 100% {
      filter: blur(.2px) hue-rotate(0deg) brightness(.9);
    }

    50% {
      filter: blur(1.4px) hue-rotate(120deg) brightness(1.3);
    }
  }
</style>
  </div>

  <div style="
    position:absolute;
    top:50%;
    left:50%;
    width:auto;
    height:auto;
    transform-style:preserve-3d;
    transform:translate(calc(-50% + 2px), calc(-50% + 0px)) scale(1);

  ">
