<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WUBBELL CONTROLS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html, body{
  margin:0;
  width:100%;
  height:100%;
  background:transparent;
  overflow:hidden;
  font-family:system-ui;
}

body{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  padding-left:40px;
}

#controls{
  display:flex;
  flex-direction:column;
  gap:34px;
  width:170px;
}

input[type=range]{
  width:170px;
  appearance:none;
  height:4px;
  background:linear-gradient(to right,#444,#888);
  border-radius:2px;
  outline:none;
}

input[type=range]::-webkit-slider-thumb{
  appearance:none;
  width:14px;
  height:14px;
  background:white;
  border-radius:50%;
  cursor:pointer;
}

input[type=range]::-moz-range-thumb{
  width:14px;
  height:14px;
  background:white;
  border-radius:50%;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="controls"></div>

<script>
const controls = document.getElementById("controls");

let currentEngine = "wub";

const settings = {
  wub: [
    ["freq", 40, 120, 1, 55],
    ["cutoff", 100, 1000, 1, 300],
    ["res", 0.1, 10, 0.1, 1.2],
    ["detune", 0, 30, 1, 6],
    ["gain", 0, 1, 0.01, 0.8]
  ],

  bell: [
    ["freq", 150, 1200, 1, 675],
    ["ratio", 0.5, 6, 0.1, 3.25],
    ["index", 0, 500, 1, 250],
    ["decay", 0.2, 5, 0.1, 2.6],
    ["cutoff", 2000, 12000, 1, 7000]
  ]
};

const values = {
  wub: {},
  bell: {}
};

settings.wub.forEach(s => values.wub[s[0]] = s[4]);
settings.bell.forEach(s => values.bell[s[0]] = s[4]);

function buildControls(engine){
  currentEngine = engine;
  controls.innerHTML = "";

  settings[engine].forEach(item => {
    const [id, min, max, step] = item;

    const slider = document.createElement("input");

    slider.type = "range";
    slider.id = id;
    slider.min = min;
    slider.max = max;
    slider.step = step;
    slider.value = values[engine][id];

    slider.addEventListener("input", () => {
      values[engine][id] = slider.value;

      window.parent.postMessage({
        type: engine + "Param",
        param: id,
        value: slider.value
      }, "*");
    });

    controls.appendChild(slider);
  });
}

window.addEventListener("message", e => {
  if(e.data.type === "setEngine"){
    buildControls(e.data.engine);
  }
});

buildControls("wub");
</script>

</body>
</html>
