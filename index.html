<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>luhvvcraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,
body {
  margin: 0;
  height: 100%;
  background: #000;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
  overflow: hidden;
}

#app {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

#beams {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  border: none;
  z-index: 0;
  pointer-events: none;
  background: #000;
}

#vocal {
  position: relative;
  width: 360px;
  height: 40vh;
  border: none;
  z-index: 10;
  background: transparent;
  display: block;
  margin-left: 40px;
  opacity: 0.96;
}

#lowerSection {
  position: relative;
  height: 60vh;
  z-index: 10;
  background: transparent;
}

#sliderPanel {
  position: absolute;
  left: 8px;
  top: 175px;
  width: 220px;
  height: 320px;
  border: none;
  background: transparent;
  display: none;
  z-index: 20;
}

#engineRail {
  position: absolute;
  right: 52px;
  top: 182px;
  display: flex;
  flex-direction: column;
  gap: 38px;
  align-items: flex-end;
  z-index: 30;
}

#wub,
#bell {
  width: 120px;
  height: 52px;
  border: none;
  background: transparent;
  overflow: hidden;
}

#playhead {
  position: absolute;
  left: 42px;
  right: 42px;
  bottom: 38px;
  height: 92px;
  border: none;
  background: transparent;
  z-index: 25;
}

/* ───────── SPIN SYSTEM ───────── */

#spinToggle {
  position: absolute;
  left: 18px;
  bottom: 22px;

  width: 88px;
  height: 44px;

  border: none;
  border-radius: 16px;

  background:
    linear-gradient(
      180deg,
      rgba(34,34,50,.96),
      rgba(10,10,18,.96)
    );

  color: #fff;

  font-size: 13px;
  font-weight: 800;
  letter-spacing: .08em;

  box-shadow:
    0 0 18px rgba(255,0,180,.22),
    0 0 40px rgba(0,180,255,.12),
    inset 0 1px 0 rgba(255,255,255,.08);

  backdrop-filter: blur(16px);

  z-index: 60;

  cursor: pointer;

  transition:
    transform .18s ease,
    box-shadow .25s ease,
    opacity .25s ease;
}

#spinToggle:active {
  transform: scale(.96);
}

#spinFrame {
  position: absolute;
  inset: 0;

  width: 100vw;
  height: 100vh;

  border: none;
  background: transparent;

  z-index: 15;

  pointer-events: none;

  opacity: 0;

  transition:
    opacity .45s ease;
}
</style>
</head>

<body>

<div id="app">

  <iframe id="beams"></iframe>

  <iframe
    id="vocal"
    allowtransparency="true">
  </iframe>

  <div id="lowerSection">

    <iframe
      id="sliderPanel"
      allowtransparency="true">
    </iframe>

    <div id="engineRail">

      <iframe
        id="wub"
        allowtransparency="true">
      </iframe>

      <iframe
        id="bell"
        allowtransparency="true">
      </iframe>

    </div>

    <iframe
      id="playhead"
      allowtransparency="true">
    </iframe>

  </div>

  <!-- SPIN OVERLAY -->
  <iframe
    id="spinFrame"
    allowtransparency="true">
  </iframe>

  <!-- SPIN BUTTON -->
  <button id="spinToggle">
    SPIN
  </button>

</div>

<script>
const version = Date.now();

document.getElementById("beams").src =
  "beams.html?v=" + version;

document.getElementById("vocal").src =
  "vocal.html?v=" + version;

document.getElementById("wub").src =
  "wub.html?v=" + version;

document.getElementById("bell").src =
  "bell.html?v=" + version;

document.getElementById("playhead").src =
  "playhead.html?v=" + version;

const app =
  document.getElementById("app");

const vocalIframe =
  document.getElementById("vocal");

const lowerSection =
  document.getElementById("lowerSection");

const sliderPanel =
  document.getElementById("sliderPanel");

const wubFrame =
  document.getElementById("wub");

const bellFrame =
  document.getElementById("bell");

/* ───────── SPIN SYSTEM ───────── */

const spinToggle =
  document.getElementById("spinToggle");

const spinFrame =
  document.getElementById("spinFrame");

let spinOn = false;

spinFrame.src =
  "spin.html?v=" + version;

spinToggle.addEventListener(
  "click",
  () => {

    spinOn = !spinOn;

    spinFrame.style.opacity =
      spinOn ? "1" : "0";

    spinToggle.textContent =
      spinOn ? "SPIN ON" : "SPIN";

    spinToggle.style.boxShadow =
      spinOn
        ? `
          0 0 28px rgba(255,0,180,.45),
          0 0 60px rgba(0,180,255,.25),
          inset 0 1px 0 rgba(255,255,255,.12)
        `
        : `
          0 0 18px rgba(255,0,180,.22),
          0 0 40px rgba(0,180,255,.12),
          inset 0 1px 0 rgba(255,255,255,.08)
        `;
  }
);

function clampHeights(){

  const H =
    window.innerHeight ||
    document.documentElement.clientHeight;

  app.style.height = H + "px";

  const vocalH =
    Math.round(H * 0.40);

  const lowerH =
    H - vocalH;

  vocalIframe.style.height =
    vocalH + "px";

  lowerSection.style.height =
    lowerH + "px";
}

clampHeights();

window.addEventListener(
  "resize",
  clampHeights
);

window.addEventListener(
  "orientationchange",
  () => setTimeout(
    clampHeights,
    80
  )
);

function openPanel(engine){

  if(!sliderPanel.src){
    sliderPanel.src =
      "wubbell.html?v=" + version;
  }

  sliderPanel.style.display =
    "block";

  setTimeout(() => {
    sliderPanel.contentWindow.postMessage({
      type: "setEngine",
      engine: engine
    }, "*");
  }, 80);
}

window.addEventListener(
  "message",
  (e) => {

    if(e.data === "openWub"){
      openPanel("wub");
    }

    if(e.data === "openBell"){
      openPanel("bell");
    }

    if(e.data.type === "wubParam"){
      wubFrame.contentWindow
        .postMessage(e.data, "*");
    }

    if(e.data.type === "bellParam"){
      bellFrame.contentWindow
        .postMessage(e.data, "*");
    }

});
</script>

</body>
</html>
