<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>luhvvcraft</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,
body {
  margin: 0;
  height: 100%;
  background: #000;
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;
  overflow: hidden;
}

#app {
  position: relative;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  background: #000;
}

#beams {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  border: none;
  z-index: 0;
  pointer-events: none;
  background: #000;
}

#vocal {
  position: relative;
  width: 360px;
  height: 40vh;
  border: none;
  z-index: 10;
  background: transparent;
  display: block;
  margin-left: 40px;
  opacity: 0.96;
}

#lowerSection {
  position: relative;
  height: 60vh;
  z-index: 10;
  background: transparent;
}

#sliderPanel {
  position: absolute;
  left: 8px;
  top: 175px;
  width: 220px;
  height: 320px;
  border: none;
  background: transparent;
  display: none;
  z-index: 20;
}

#engineRail {
  position: absolute;
  right: 52px;
  top: 182px;
  display: flex;
  flex-direction: column;
  gap: 38px;
  align-items: flex-end;
  z-index: 30;
}

#wub,
#bell {
  width: 120px;
  height: 52px;
  border: none;
  background: transparent;
  overflow: hidden;
}
</style>
</head>

<body>

<div id="app">

  <iframe id="beams"></iframe>

  <iframe
    id="vocal"
    allowtransparency="true">
  </iframe>

  <div id="lowerSection">

    <iframe
      id="sliderPanel"
      allowtransparency="true">
    </iframe>

    <div id="engineRail">

      <iframe
        id="wub"
        allowtransparency="true">
      </iframe>

      <iframe
        id="bell"
        allowtransparency="true">
      </iframe>

    </div>

  </div>

</div>

<script>
const version = Date.now();

document.getElementById("beams").src =
  "beams.html?v=" + version;

document.getElementById("vocal").src =
  "vocal.html?v=" + version;

document.getElementById("wub").src =
  "wub.html?v=" + version;

document.getElementById("bell").src =
  "bell.html?v=" + version;

const app =
  document.getElementById("app");

const vocalIframe =
  document.getElementById("vocal");

const lowerSection =
  document.getElementById("lowerSection");

const sliderPanel =
  document.getElementById("sliderPanel");

const wubFrame =
  document.getElementById("wub");

const bellFrame =
  document.getElementById("bell");

function clampHeights(){

  const H =
    window.innerHeight ||
    document.documentElement.clientHeight;

  app.style.height = H + "px";

  const vocalH =
    Math.round(H * 0.40);

  const lowerH =
    H - vocalH;

  vocalIframe.style.height =
    vocalH + "px";

  lowerSection.style.height =
    lowerH + "px";
}

clampHeights();

window.addEventListener(
  "resize",
  clampHeights
);

window.addEventListener(
  "orientationchange",
  () => setTimeout(
    clampHeights,
    80
  )
);

function openPanel(engine){

  if(!sliderPanel.src){
    sliderPanel.src =
      "wubbell.html?v=" + version;
  }

  sliderPanel.style.display =
    "block";

  setTimeout(() => {
    sliderPanel.contentWindow.postMessage({
      type: "setEngine",
      engine: engine
    }, "*");
  }, 80);
}

window.addEventListener(
  "message",
  (e) => {

    if(e.data === "openWub"){
      openPanel("wub");
    }

    if(e.data === "openBell"){
      openPanel("bell");
    }

    if(e.data.type === "wubParam"){
      wubFrame.contentWindow
        .postMessage(e.data, "*");
    }

    if(e.data.type === "bellParam"){
      bellFrame.contentWindow
        .postMessage(e.data, "*");
    }

});
</script>

</body>
</html>
